<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Progressive Enhancement Validation</title>
    <style>
        body {
            font-family: 'Courier New', monospace;
            background: #0a0a14;
            color: #00ff88;
            padding: 20px;
            margin: 0;
        }
        
        .test-container {
            max-width: 800px;
            margin: 0 auto;
        }
        
        .test-result {
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #333;
            border-radius: 4px;
            background: #1a1a2e;
        }
        
        .test-pass { border-color: #00ff88; }
        .test-fail { border-color: #ff0040; color: #ff0040; }
        .test-warning { border-color: #ffaa00; color: #ffaa00; }
        
        .mandala-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin: 20px 0;
            max-width: 600px;
        }
        
        .mandala-item {
            background: #16213e;
            padding: 20px;
            border: 1px solid #0f3460;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .mandala-item:hover {
            border-color: #0ef;
            box-shadow: 0 0 10px rgba(0, 238, 255, 0.3);
        }
        
        .mandala-item-title {
            font-size: 16px;
            margin-bottom: 10px;
        }
        
        .prayer-wheel-player {
            background: #1a1a2e;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
        }
        
        .play-pause-btn {
            background: #0f3460;
            border: 1px solid #0ef;
            color: #0ef;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
        }
        
        .progress-bar {
            width: 100%;
            height: 4px;
            background: #333;
            margin: 10px 0;
            position: relative;
        }
        
        .progress-fill {
            height: 100%;
            background: #0ef;
            width: 0%;
            transition: width 0.1s;
        }
        
        .time-display {
            font-size: 14px;
            color: #888;
        }
        
        .loading-indicator {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #1a1a2e;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #0ef;
        }
        
        .loading-spinner {
            width: 20px;
            height: 20px;
            border: 2px solid #333;
            border-top: 2px solid #0ef;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>Progressive Enhancement System Validation</h1>
        
        <div id="test-results">
            <div class="test-result">
                <strong>Test Status:</strong> <span id="overall-status">Initializing...</span>
            </div>
        </div>
        
        <h2>Sample Components</h2>
        
        <div class="mandala-grid">
            <div class="mandala-item" tabindex="0">
                <div class="mandala-item-title">Stories</div>
                <div class="mandala-item-desc">Fiction & Narratives</div>
            </div>
            <div class="mandala-item" tabindex="0">
                <div class="mandala-item-title">Audio</div>
                <div class="mandala-item-desc">Spoken Stories</div>
            </div>
            <div class="mandala-item" tabindex="0">
                <div class="mandala-item-title">Books</div>
                <div class="mandala-item-desc">Publications</div>
            </div>
        </div>
        
        <div class="prayer-wheel-player" data-audio="/static/audio/test.mp3">
            <button class="play-pause-btn" aria-pressed="false">
                <span class="play-icon">▶</span>
                <span class="pause-icon" style="display: none;">⏸</span>
                <span class="btn-state-text">Play</span>
            </button>
            <div class="progress-bar" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">
                <div class="progress-fill"></div>
            </div>
            <div class="time-display">0:00 / 0:00</div>
        </div>
    </div>

    <!-- Load the progressive enhancement system -->
    <script src="themes/AUTHOR/assets/js/progressive-enhancement.js"></script>
    <script src="themes/AUTHOR/assets/js/main.js"></script>
    
    <script>
        // Test runner
        const tests = [];
        
        function addTest(name, testFn) {
            tests.push({ name, testFn });
        }
        
        function runTests() {
            const resultsContainer = document.getElementById('test-results');
            const statusElement = document.getElementById('overall-status');
            let passCount = 0;
            let totalCount = tests.length;
            
            tests.forEach(test => {
                try {
                    const result = test.testFn();
                    const div = document.createElement('div');
                    div.className = `test-result ${result.status}`;
                    div.innerHTML = `<strong>${test.name}:</strong> ${result.message}`;
                    resultsContainer.appendChild(div);
                    
                    if (result.status === 'test-pass') {
                        passCount++;
                    }
                } catch (e) {
                    const div = document.createElement('div');
                    div.className = 'test-result test-fail';
                    div.innerHTML = `<strong>${test.name}:</strong> ERROR - ${e.message}`;
                    resultsContainer.appendChild(div);
                }
            });
            
            const overall = passCount === totalCount ? 'PASS' : 
                           passCount > totalCount / 2 ? 'PARTIAL' : 'FAIL';
            statusElement.textContent = `${passCount}/${totalCount} tests passed (${overall})`;
        }
        
        // Define tests
        addTest('Progressive Enhancement Object', () => {
            if (window.ProgressiveEnhancement) {
                return { status: 'test-pass', message: 'ProgressiveEnhancement object found' };
            }
            return { status: 'test-fail', message: 'ProgressiveEnhancement object not found' };
        });
        
        addTest('Main JS Functions', () => {
            if (typeof initBasicFeatures === 'function' && 
                typeof initEnhancedFeatures === 'function') {
                return { status: 'test-pass', message: 'Main functions defined' };
            }
            return { status: 'test-fail', message: 'Main functions missing' };
        });
        
        addTest('Device Detection', () => {
            const bodyClasses = document.body.classList;
            if (bodyClasses.contains('mobile') || bodyClasses.contains('desktop')) {
                return { status: 'test-pass', message: 'Device type detected and applied' };
            }
            return { status: 'test-warning', message: 'Device classes not applied yet' };
        });
        
        addTest('Accessibility Features', () => {
            const liveRegion = document.getElementById('live-announcements');
            if (liveRegion && typeof window.announceToScreenReader === 'function') {
                return { status: 'test-pass', message: 'Accessibility features initialized' };
            }
            return { status: 'test-fail', message: 'Accessibility features missing' };
        });
        
        addTest('Keyboard Navigation', () => {
            const mandalaItems = document.querySelectorAll('.mandala-item[tabindex]');
            if (mandalaItems.length > 0) {
                return { status: 'test-pass', message: 'Keyboard navigation enabled' };
            }
            return { status: 'test-fail', message: 'Keyboard navigation not set up' };
        });
        
        addTest('Audio Player Basic Functionality', () => {
            const players = document.querySelectorAll('.prayer-wheel-player');
            const playButtons = document.querySelectorAll('.play-pause-btn');
            if (players.length > 0 && playButtons.length > 0) {
                return { status: 'test-pass', message: 'Audio players found and initialized' };
            }
            return { status: 'test-warning', message: 'Audio players may not be fully initialized' };
        });
        
        // Wait for DOM and scripts to load
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                runTests();
            }, 1000); // Give time for progressive enhancement to initialize
        });
        
        // Listen for progressive enhancement events
        document.addEventListener('progressive-enhancement-ready', (e) => {
            console.log('Progressive enhancement ready:', e.detail);
            const div = document.createElement('div');
            div.className = 'test-result test-pass';
            div.innerHTML = '<strong>System Event:</strong> Progressive enhancement initialization complete';
            document.getElementById('test-results').appendChild(div);
        });
    </script>
</body>
</html>
