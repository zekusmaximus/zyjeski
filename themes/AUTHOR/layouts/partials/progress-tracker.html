{{/* Tracks reading progress and provides visual feedback to users */}}

<div id="reading-progress-tracker" class="progress-tracker">
  <!-- Scroll Progress Bar -->
  <div class="scroll-progress-bar">
    <div class="scroll-progress-fill"></div>
  </div>
  
  <!-- Reading Time Estimate -->
  <div class="reading-estimate" id="reading-estimate">
    <span class="estimate-icon">📖</span>
    <span class="estimate-text">
      <span id="estimated-time">5 min</span> read
    </span>
  </div>
  
  <!-- Section Progress Indicators -->
  <div class="section-progress" id="section-progress">
    <div class="section-indicators">
      <!-- Will be populated by JavaScript based on content structure -->
    </div>
  </div>
  
  <!-- Reading Speed Tracker -->
  <div class="reading-speed-tracker" id="reading-speed-tracker" style="display: none;">
    <div class="speed-content">
      <div class="speed-icon">⚡</div>
      <div class="speed-details">
        <div class="speed-label">Reading Speed</div>
        <div class="speed-value" id="current-speed">250 wpm</div>
      </div>
    </div>  </div>
  
  <!-- Session Summary -->
  <div class="session-summary-widget" id="session-summary-widget" style="display: none;">
    <div class="summary-header">
      <div class="summary-icon">📊</div>
      <div class="summary-title">Session Summary</div>
      <button class="summary-toggle" id="summary-toggle">−</button>
    </div>
    <div class="summary-body">
      <div class="summary-metrics">
        <div class="metric">
          <span class="metric-value" id="session-pages">0</span>
          <span class="metric-label">Pages</span>
        </div>
        <div class="metric">
          <span class="metric-value" id="session-duration">0m</span>
          <span class="metric-label">Time</span>
        </div>
        <div class="metric">
          <span class="metric-value" id="session-words">0</span>
          <span class="metric-label">Words</span>
        </div>
      </div>
      <div class="summary-insights">
        <div class="insight" id="session-insight">
          Keep exploring to discover more content!
        </div>
      </div>
    </div>  </div>
</div>

<style>
/* Progress Tracker Styles */
.progress-tracker {
  --progress-color: #00ff9f;
  --progress-bg: rgba(255, 255, 255, 0.1);
  --progress-text: #ffffff;
  --progress-secondary: #888888;
}

/* Scroll Progress Bar */
.scroll-progress-bar {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 3px;
  background: var(--progress-bg);
  z-index: 1000;
  opacity: 0;
  transition: opacity 0.3s ease;
}

.scroll-progress-bar.visible {
  opacity: 1;
}

.scroll-progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--progress-color), #00d4aa);
  width: 0%;
  transition: width 0.1s ease-out;
  box-shadow: 0 0 10px rgba(0, 255, 159, 0.5);
}

/* Reading Time Estimate */
.reading-estimate {
  position: fixed;
  top: 20px;
  left: 20px;
  background: rgba(26, 26, 46, 0.9);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 8px;
  padding: 8px 12px;
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 0.85rem;
  color: var(--progress-text);
  z-index: 999;
  opacity: 0;
  transform: translateY(-10px);
  transition: all 0.3s ease;
}

.reading-estimate.visible {
  opacity: 1;
  transform: translateY(0);
}

.estimate-icon {
  font-size: 1rem;
}

/* Section Progress Indicators */
.section-progress {
  position: fixed;
  right: 20px;
  top: 50%;
  transform: translateY(-50%);
  z-index: 998;
  opacity: 0;
  transition: opacity 0.3s ease;
}

.section-progress.visible {
  opacity: 1;
}

.section-indicators {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.section-indicator {
  width: 4px;
  height: 20px;
  background: var(--progress-bg);
  border-radius: 2px;
  position: relative;
  cursor: pointer;
  transition: all 0.2s ease;
}

.section-indicator.active {
  background: var(--progress-color);
  box-shadow: 0 0 8px rgba(0, 255, 159, 0.6);
}

.section-indicator.visited {
  background: rgba(0, 255, 159, 0.6);
}

.section-indicator:hover::after {
  content: attr(data-title);
  position: absolute;
  right: 10px;
  top: 50%;
  transform: translateY(-50%);
  background: rgba(0, 0, 0, 0.9);
  color: white;
  padding: 4px 8px;
  border-radius: 4px;
  font-size: 0.75rem;
  white-space: nowrap;
  z-index: 1001;
}

/* Reading Speed Tracker */
.reading-speed-tracker {
  position: fixed;
  bottom: 120px;
  right: 20px;
  background: rgba(26, 26, 46, 0.9);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 8px;
  padding: 12px;
  z-index: 997;
  opacity: 0;
  transform: translateY(10px);
  transition: all 0.3s ease;
}

.reading-speed-tracker.visible {
  opacity: 1;
  transform: translateY(0);
}

.speed-content {
  display: flex;
  align-items: center;
  gap: 10px;
}

.speed-icon {
  font-size: 1.2rem;
}

.speed-label {
  font-size: 0.7rem;
  color: var(--progress-secondary);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.speed-value {
  font-size: 0.9rem;
  font-weight: 600;
  color: var(--progress-color);
}

/* Content Type Progress */
.content-type-progress {
  position: fixed;
  bottom: 20px;
  left: 20px;
  background: rgba(26, 26, 46, 0.95);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 12px;
  padding: 16px;
  max-width: 280px;
  z-index: 996;
  opacity: 0;
  transform: translateX(-20px);
  transition: all 0.3s ease;
}

.content-type-progress.visible {
  opacity: 1;
  transform: translateX(0);
}

.type-progress-header h4 {
  margin: 0 0 12px 0;
  font-size: 1rem;
  color: var(--progress-text);
}

.type-progress-grid {
  display: grid;
  gap: 10px;
}

.type-progress-item {
  display: grid;
  grid-template-columns: 24px 1fr 40px;
  align-items: center;
  gap: 8px;
  padding: 6px 0;
}

.type-icon {
  font-size: 1rem;
  text-align: center;
}

.type-label {
  font-size: 0.8rem;
  color: var(--progress-text);
}

.type-progress-bar {
  height: 4px;
  background: var(--progress-bg);
  border-radius: 2px;
  overflow: hidden;
}

.type-progress-fill {
  height: 100%;
  background: var(--progress-color);
  width: 0%;
  transition: width 0.3s ease;
}

.type-count {
  font-size: 0.7rem;
  color: var(--progress-secondary);
  text-align: right;
}

/* Session Summary Widget */
.session-summary-widget {
  position: fixed;
  top: 20px;
  right: 20px;
  background: rgba(26, 26, 46, 0.95);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 12px;
  overflow: hidden;
  z-index: 995;
  max-width: 250px;
  opacity: 0;
  transform: translateY(-10px);
  transition: all 0.3s ease;
}

.session-summary-widget.visible {
  opacity: 1;
  transform: translateY(0);
}

.summary-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
  background: rgba(255, 255, 255, 0.05);
  border-bottom: 1px solid rgba(255, 255, 255, 0.1);
}

.summary-title {
  font-size: 0.9rem;
  font-weight: 600;
  color: var(--progress-text);
  margin-left: 6px;
}

.summary-toggle {
  background: none;
  border: none;
  color: var(--progress-secondary);
  font-size: 1.2rem;
  cursor: pointer;
  padding: 0;
}

.summary-body {
  padding: 16px;
}

.summary-metrics {
  display: flex;
  justify-content: space-between;
  margin-bottom: 12px;
}

.metric {
  text-align: center;
}

.metric-value {
  display: block;
  font-size: 1.1rem;
  font-weight: 600;
  color: var(--progress-color);
  margin-bottom: 2px;
}

.metric-label {
  font-size: 0.7rem;
  color: var(--progress-secondary);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.summary-insights {
  padding-top: 12px;
  border-top: 1px solid rgba(255, 255, 255, 0.1);
}

.insight {
  font-size: 0.8rem;
  color: var(--progress-secondary);
  text-align: center;
  font-style: italic;
}

/* UI Component Toggles */
.ui-component-toggles {
  position: fixed;
  top: 80px;
  right: 20px;
  z-index: 1002;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.ui-component-toggle {
  background: rgba(255, 255, 255, 0.1);
  border: 1px solid rgba(255, 255, 255, 0.2);
  border-radius: 8px;
  padding: 10px;
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  transition: background 0.3s ease, transform 0.2s ease;
}

.ui-component-toggle:hover {
  background: rgba(255, 255, 255, 0.15);
}

.ui-component-toggle:active {
  transform: scale(0.98);
}

.toggle-icon {
  font-size: 1.2rem;
  color: var(--progress-color);
}

/* Reader Stats Mini Widget */
.reader-stats-mini {
  position: fixed;
  top: 20px;
  right: 20px;
  background: rgba(26, 26, 46, 0.95);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 12px;
  padding: 16px;
  max-width: 300px;
  z-index: 1003;
  opacity: 0;
  transform: translateY(-10px);
  transition: all 0.3s ease;
}

.reader-stats-mini.show {
  opacity: 1;
  transform: translateY(0);
}

.reader-stats-header {
  margin-bottom: 12px;
}

.reader-stats-title {
  font-size: 1rem;
  font-weight: 600;
  color: var(--progress-text);
  margin: 0;
}

.reader-stats-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
}

.reader-stat-item {
  text-align: center;
}

.reader-stat-value {
  font-size: 1.2rem;
  font-weight: 700;
  color: var(--progress-color);
  margin-bottom: 4px;
}

.reader-stat-label {
  font-size: 0.75rem;
  color: var(--progress-secondary);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

/* Mobile Responsiveness */
@media (max-width: 768px) {
  .reading-estimate {
    top: 10px;
    left: 10px;
    font-size: 0.75rem;
    padding: 6px 10px;
  }
  
  .section-progress {
    right: 10px;
  }
  
  .content-type-progress {
    bottom: 10px;
    left: 10px;
    right: 10px;
    max-width: none;
  }
  
  .reading-speed-tracker {
    right: 10px;
    bottom: 100px;
  }
  
  .session-summary-widget {
    top: 10px;
    right: 10px;
    left: 10px;
    max-width: none;
  }
  
  .scroll-progress-bar {
    height: 2px;
  }
  
  .ui-component-toggles {
    top: 70px;
    right: 10px;
  }
  
  .reader-stats-mini {
    top: 70px;
    right: 10px;
    max-width: none;
  }
}

/* Dark mode specific adjustments */
@media (prefers-color-scheme: dark) {
  .progress-tracker {
    --progress-bg: rgba(255, 255, 255, 0.05);
  }
}

/* Reduced motion accessibility */
@media (prefers-reduced-motion: reduce) {
  .scroll-progress-fill,
  .type-progress-fill,
  .progress-tracker * {
    transition: none !important;
    animation: none !important;
  }
}
</style>

<script>
// Progress Tracker JavaScript Integration
class ProgressTracker {
  constructor() {
    this.scrollProgress = 0;
    this.readingSpeed = 250; // Default WPM
    this.wordCount = 0;
    this.readingStartTime = Date.now();
    this.sections = [];
    this.sessionData = {
      pages: 0,
      duration: 0,
      words: 0
    };
    
    this.init();
  }
    init() {
    this.calculateWordCount();
    this.setupScrollTracking();
    this.setupSectionTracking();
    this.setupReadingEstimate();
    this.setupSessionTracking();
    this.bindEvents();
    
    // Show appropriate widgets based on page type
    this.showRelevantWidgets();
  }
  
  calculateWordCount() {
    const content = document.querySelector('main article, .content, .post-content, .story-content');
    if (content) {
      const text = content.textContent || content.innerText || '';
      this.wordCount = text.trim().split(/\s+/).length;
    }
  }
  
  setupScrollTracking() {
    const progressBar = document.querySelector('.scroll-progress-bar');
    const progressFill = document.querySelector('.scroll-progress-fill');
    
    if (!progressBar || !progressFill) return;
    
    const updateScrollProgress = () => {
      const winScroll = document.body.scrollTop || document.documentElement.scrollTop;
      const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
      const scrolled = (winScroll / height) * 100;
      
      this.scrollProgress = Math.min(scrolled, 100);
      progressFill.style.width = this.scrollProgress + '%';
      
      // Show progress bar when scrolling starts
      if (this.scrollProgress > 0) {
        progressBar.classList.add('visible');
      }
    };
    
    window.addEventListener('scroll', this.throttle(updateScrollProgress, 16));
  }
  
  setupSectionTracking() {
    const sections = document.querySelectorAll('h1, h2, h3, section');
    const indicatorsContainer = document.querySelector('.section-indicators');
    const progressContainer = document.querySelector('.section-progress');
    
    if (!sections.length || !indicatorsContainer) return;
    
    sections.forEach((section, index) => {
      const indicator = document.createElement('div');
      indicator.className = 'section-indicator';
      indicator.dataset.title = section.textContent?.trim() || `Section ${index + 1}`;
      indicator.addEventListener('click', () => {
        section.scrollIntoView({ behavior: 'smooth' });
      });
      
      indicatorsContainer.appendChild(indicator);
      this.sections.push({ element: section, indicator });
    });
    
    // Update section indicators on scroll
    const updateSectionProgress = () => {
      const scrollPosition = window.scrollY + window.innerHeight / 2;
      
      this.sections.forEach((section, index) => {
        const sectionTop = section.element.offsetTop;
        const sectionHeight = section.element.offsetHeight;
        
        if (scrollPosition >= sectionTop && scrollPosition <= sectionTop + sectionHeight) {
          section.indicator.classList.add('active');
          section.indicator.classList.add('visited');
        } else {
          section.indicator.classList.remove('active');
          if (scrollPosition > sectionTop + sectionHeight) {
            section.indicator.classList.add('visited');
          }
        }
      });
    };
    
    window.addEventListener('scroll', this.throttle(updateSectionProgress, 100));
    progressContainer.classList.add('visible');
  }
  
  setupReadingEstimate() {
    const estimateElement = document.getElementById('estimated-time');
    const estimateContainer = document.querySelector('.reading-estimate');
    
    if (!estimateElement || !this.wordCount) return;
    
    const estimatedMinutes = Math.ceil(this.wordCount / this.readingSpeed);
    estimateElement.textContent = estimatedMinutes + ' min';
    
    setTimeout(() => {
      estimateContainer.classList.add('visible');    }, 1000);
  }
  
  setupSessionTracking() {
    const summaryWidget = document.getElementById('session-summary-widget');
    const toggle = document.getElementById('summary-toggle');
    
    if (!summaryWidget) return;
    
    // Update session data periodically
    setInterval(() => {
      this.updateSessionData();
    }, 5000);
    
    // Show session summary after significant engagement
    setTimeout(() => {
      if (this.scrollProgress > 25) {
        summaryWidget.classList.add('visible');
      }
    }, 30000); // 30 seconds
    
    // Toggle functionality
    toggle?.addEventListener('click', () => {
      const body = summaryWidget.querySelector('.summary-body');
      const isCollapsed = body.style.display === 'none';
      
      body.style.display = isCollapsed ? 'block' : 'none';
      toggle.textContent = isCollapsed ? '−' : '+';
    });
  }
  
  updateSessionData() {
    if (!window.readerJourney) return;
    
    const stats = window.readerJourney.getReadingStats();
    const duration = Math.floor((Date.now() - this.readingStartTime) / 60000); // minutes
    
    // Update session metrics
    document.getElementById('session-pages').textContent = stats.pagesRead;
    document.getElementById('session-duration').textContent = duration + 'm';
    document.getElementById('session-words').textContent = this.wordCount;
    
    // Update insight based on behavior
    const insight = this.generateSessionInsight(stats, duration);
    document.getElementById('session-insight').textContent = insight;
  }
  
  generateSessionInsight(stats, duration) {
    if (duration > 10 && this.scrollProgress > 80) {
      return "You're a dedicated reader! Consider exploring related content.";
    }
    if (stats.pagesRead > 3) {
      return "You're on a journey! Keep exploring different content types.";
    }
    if (this.scrollProgress < 25) {
      return "Take your time to fully absorb the content.";
    }
    return "Every page read brings new insights.";
  }
  
  showRelevantWidgets() {
    const currentPage = window.location.pathname;
    
    // Show reading estimate and scroll progress on content pages
    if (currentPage.includes('/stories/') || currentPage.includes('/books/') || currentPage.includes('/posts/')) {
      // These are already handled in their respective setup functions
    }
    
    // Show speed tracker for long content
    if (this.wordCount > 1000) {
      setTimeout(() => {
        const speedTracker = document.getElementById('reading-speed-tracker');
        speedTracker?.classList.add('visible');
      }, 10000);
    }
  }
  
  bindEvents() {
    // Update reading speed based on actual reading behavior
    let wordsRead = 0;
    let readingStartTime = Date.now();
    
    window.addEventListener('scroll', this.throttle(() => {
      const wordsOnScreen = this.estimateWordsOnScreen();
      if (wordsOnScreen > wordsRead) {
        const timeElapsed = (Date.now() - readingStartTime) / 60000; // minutes
        const currentSpeed = Math.round((wordsOnScreen - wordsRead) / timeElapsed);
        
        if (currentSpeed > 0 && currentSpeed < 1000) { // Reasonable bounds
          this.readingSpeed = currentSpeed;
          document.getElementById('current-speed').textContent = currentSpeed + ' wpm';
        }
        
        wordsRead = wordsOnScreen;
      }
    }, 2000));
  }
  
  estimateWordsOnScreen() {
    const viewportHeight = window.innerHeight;
    const scrollTop = window.scrollY;
    const contentElement = document.querySelector('main article, .content');
    
    if (!contentElement) return 0;
    
    const lines = contentElement.querySelectorAll('p, li, h1, h2, h3, h4, h5, h6');
    let wordsOnScreen = 0;
    
    lines.forEach(line => {
      const rect = line.getBoundingClientRect();
      const absoluteTop = rect.top + scrollTop;
      
      if (absoluteTop >= scrollTop && absoluteTop <= scrollTop + viewportHeight) {
        const text = line.textContent || line.innerText || '';
        wordsOnScreen += text.trim().split(/\s+/).length;
      }
    });
    
    return wordsOnScreen;
  }
  
  throttle(func, limit) {
    let lastFunc;
    let lastRan;
    return function() {
      const context = this;
      const args = arguments;
      if (!lastRan) {
        func.apply(context, args);
        lastRan = Date.now();
      } else {
        clearTimeout(lastFunc);
        lastFunc = setTimeout(function() {
          if ((Date.now() - lastRan) >= limit) {
            func.apply(context, args);
            lastRan = Date.now();
          }
        }, limit - (Date.now() - lastRan));      }
    };
  }
}

// Initialize progress tracker when DOM is ready
document.addEventListener('DOMContentLoaded', () => {
  window.progressTracker = new ProgressTracker();
});
</script>
