baseURL = 'https://www.zyjeski.com/'
languageCode = 'en-us'
title = 'Jeffrey A, Zyjeski Esq. Speculative Fiction Author'
theme = "AUTHOR"
canonifyURLs = false
relativeURLs = false

# Basic author information
[params]
  author = 'Jeffrey A. Zyjeski'
  description = 'Jeffrey A. Zyjeski writes satirical science fiction and speculative stories. Author of The Forms Must Flow and other character-driven, humorous sci-fi.'
  
  # Social sharing configuration
  [params.social_sharing]
    enabled = true
    brand_hashtag = "NeuroDigitalEnlightenment"
    default_image = "/images/promotional/substack-banner.jpg"
    
    # Content type customization
    [params.social_sharing.content_types]
      koan_prefix = "Share this digital koan"
      koan_description = "Explore this neuro-digital koan from the path to enlightenment"
      simulation_prefix = "Share this neural simulation" 
      simulation_description = "Experience this guided neural rebooting protocol"
      transmission_prefix = "Share this transmission"
      transmission_description = "Receive this digital transmission on the path to enlightenment"
      manuscript_prefix = "Share this digital manuscript"
      manuscript_description = "Discover this collection from the neuro-digital archives"
      insight_prefix = "Share this insight"
      insight_description = "Explore this fragment of neuro-digital wisdom"

   # Featured spot 1
  featured_title_1 = "Latest Book"
  featured_subtitle_1 = "New Release"
  featured_image_1 = "/images/books/promo/featured-book.jpg"
  featured_link_1 = "/books/latest/"
  
  # Featured spot 2
  featured_title_2 = "Upcoming Event"
  featured_subtitle_2 = "Speaking Engagement"
  featured_image_2 = "/images/promotional/featured-event.jpg"
  featured_link_2 = "/events/"

# Optional social media links
[params.social]
  twitter = '@zekusmaximus'
  facebook = 'https://www.facebook.com/zyjeski'
  instagram = 'https://www.instagram.com/zeksumaximus/'
  # goodreads = 'yourgoodreadsprofile'
  amazon = 'https://www.amazon.com/stores/Jeffrey-Zyjeski/author/B0F2GDTL7K'

# Menu configuration (from your existing theme)
[[menu.main]]
    name = 'Home'
    pageRef = '/'
    weight = 10

  [[menu.main]]
    name = 'Books'
    pageRef = '/books'
    weight = 20

  [[menu.main]]
    name = 'Stories'
    pageRef = '/stories'
    weight = 30

  [[menu.main]]
    name = 'Audio'
    pageRef = '/audio'
    weight = 40

  [[menu.main]]
    name = 'Blog'
    pageRef = '/posts'
    weight = 50
    
  [[menu.main]]
    name = 'Newsletter'
    pageRef = '/newsletter'
    weight = 60

  [[menu.main]]
    name = 'About'
    pageRef = '/about'
    weight = 70

  [[menu.main]]
    name = 'Agent/Editor Inquiries'
    pageRef = '/inquiries'
    weight = 80

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
